name: Update MSTR mNAV data

on:
  workflow_dispatch:

  schedule:
    # 매주 월요일 00:00 UTC = 한국시간 월요일 오전 9시
    - cron: "0 0 * * 1"

permissions:
  contents: write
  
jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
  uses: actions/checkout@v4
  with: persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install dependencies
        run: |
          pip install requests beautifulsoup4

      - name: Update Strategy data
        run: |
          python .github/update_data.py

      - name: Check changes
        id: changes
        run: |
          git diff --quiet data.json || echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Commit updated data
        if: steps.changes.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto update MSTR mNAV data"
          git push
