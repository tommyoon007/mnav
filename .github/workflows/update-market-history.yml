name: Update MSTR historical data

on:
  workflow_dispatch:

  schedule:
    # Live market data
    # Every 5 minutes
    - cron: "*/5 * * * *"

    # Historical data
    # Every day at 09:15 KST
    # 00:15 UTC
    - cron: "15 0 * * *"


permissions:
  contents: write


jobs:

  # =======================================================
  # LIVE MARKET DATA
  # =======================================================

  update-live:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Update live market data
        run: |
          python .github/update_market_prices.py

      - name: Show live data
        run: |
          echo "===== live.json ====="
          cat live.json

      - name: Commit live data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add live.json

          if git diff --cached --quiet; then
            echo "No live data changes."
            exit 0
          fi

          git commit -m "Update live market data"
          git push


  # =======================================================
  # HISTORICAL DATA
  # =======================================================

  update-history:
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '15 0 * * *'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Update historical data
        run: |
          python .github/update_market_history.py

      - name: Show historical data
        run: |
          echo "===== history.json ====="
          cat history.json

      - name: Commit historical data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add history.json data.json

          if git diff --cached --quiet; then
            echo "No historical data changes."
            exit 0
          fi

          git commit -m "Update MSTR historical data"
          git push
