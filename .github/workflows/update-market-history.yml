name: Update MSTR historical data

on:
  workflow_dispatch:

  schedule:
    # 매일 한국시간 오전 9시 15분
    - cron: "15 0 * * *"

permissions:
  contents: write

jobs:
  update-history:
    runs-on: ubuntu-latest

    steps:

      # =====================================================
      # 1. Checkout
      # =====================================================

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # =====================================================
      # 2. Python
      # =====================================================

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # =====================================================
      # 3. Dependencies
      # =====================================================

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      # =====================================================
      # 4. Update historical data
      # =====================================================

      - name: Update historical data
        run: |
          python .github/update_market_history.py

      # =====================================================
      # 5. Update live market data
      # =====================================================

      - name: Update live market data
        run: |
          python .github/update_market_prices.py

      # =====================================================
      # 6. Show generated data
      # =====================================================

      - name: Show generated data
        run: |
          echo "======================================"
          echo "LIVE.JSON"
          echo "======================================"
          cat live.json

          echo ""
          echo "======================================"
          echo "HISTORY.JSON"
          echo "======================================"
          cat history.json

      # =====================================================
      # 7. Configure Git
      # =====================================================

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      # =====================================================
      # 8. Commit generated data
      # =====================================================

      - name: Commit generated data
        run: |
          git add history.json live.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update MSTR history and live data"

      # =====================================================
      # 9. Pull remote changes automatically
      # =====================================================

      - name: Sync with remote
        run: |
          git fetch origin main

          git rebase origin/main

      # =====================================================
      # 10. Push
      # =====================================================

      - name: Push changes
        run: |
          git push origin HEAD:main
