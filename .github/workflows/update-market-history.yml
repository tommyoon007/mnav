name: Update MSTR Fundamentals & History

on:
  workflow_dispatch:
  schedule:
    # 3시간마다 실행 (기초 데이터 및 일별 히스토리 수집)
    - cron: "0 */3 * * *"

permissions:
  contents: write

concurrency:
  group: mnav-main-update
  cancel-in-progress: true

jobs:
  update-market-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install requests

      - name: Update market history
        run: |
          python .github/update_market_history.py

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json history.json
          git diff --staged --quiet || (git commit -m "Chore: Update fundamentals & history" && git push)
