name: Update MSTR historical data

on:
  workflow_dispatch:

  schedule:
    # 매일 한국시간 오전 9시 15분
    - cron: "15 0 * * *"

permissions:
  contents: write

jobs:
  update-history:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Update historical data
        run: |
          python .github/update_market_history.py

      - name: Update live market data
        run: |
          python .github/update_market_prices.py

      - name: Show generated data
        run: |
          echo "===== live.json ====="
          cat live.json

          echo "===== history.json ====="
          cat history.json

      - name: Commit history and live data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add history.json live.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update MSTR history and live data"
          git push
