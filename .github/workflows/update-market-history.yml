name: Update MSTR historical data

on:
  workflow_dispatch: # 필요할 때 수동 실행
  schedule:
    - cron: "0 */3 * * *" # 3시간마다 1번만 실행

permissions:
  contents: write

concurrency:
  group: mnav-main-update
  cancel-in-progress: true

jobs:
  update-market-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Update market history
        run: |
          python .github/update_market_history.py

      - name: Commit and Push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data.json history.json live.json
          git diff --staged --quiet || (git commit -m "Update MSTR market data" && git push)
