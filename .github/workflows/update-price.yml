name: Update MSTR Price

on:
  schedule:
    - cron: '*/15 * * * *'   # 15분마다 실행 (필요하면 간격 조정)
  workflow_dispatch:          # Actions 탭에서 수동 실행도 가능

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch MSTR price from Finnhub
        id: price
        env:
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: |
          RESPONSE=$(curl -s "https://finnhub.io/api/v1/quote?symbol=MSTR&token=${FINNHUB_API_KEY}")
          PRICE=$(echo "$RESPONSE" | jq -r '.c')
          if [ "$PRICE" = "null" ] || [ -z "$PRICE" ]; then
            echo "가격을 가져오지 못했습니다: $RESPONSE"
            exit 1
          fi
          echo "price=$PRICE" >> "$GITHUB_OUTPUT"

      - name: Update data.json
        env:
          PRICE: ${{ steps.price.outputs.price }}
        run: |
          TIMESTAMP=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          jq --argjson price "$PRICE" --arg ts "$TIMESTAMP" \
            '.mstrPrice = $price | .updatedAt = $ts' data.json > tmp.json
          mv tmp.json data.json

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet || git commit -m "chore: update MSTR live price [skip ci]"
          git push
