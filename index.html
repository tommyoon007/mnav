<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSTR & BTC Real-time Dashboard</title>
    <!-- Chart.js CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #38bdf8;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border-color: #334155;
            --green: #22c55e;
            --red: #ef4444;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }

        h1 {
            text-align: center;
            margin-bottom: 24px;
            color: var(--accent-color);
            font-size: 1.8rem;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 24px;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 20px;
        }

        .card-title {
            font-size: 1.1rem;
            font-weight: 600;
            margin-bottom: 16px;
            color: var(--accent-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .input-group {
            margin-bottom: 12px;
        }

        .input-group label {
            display: block;
            font-size: 0.85rem;
            color: var(--text-sub);
            margin-bottom: 4px;
        }

        .input-group input {
            width: 100%;
            padding: 10px;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 6px;
            color: var(--text-main);
            font-size: 1rem;
        }

        .input-group input:focus {
            outline: none;
            border-color: var(--accent-color);
        }

        .metric-row {
            display: flex;
            justify-content: space-between;
            padding: 10px 0;
            border-bottom: 1px solid var(--border-color);
        }

        .metric-row:last-child {
            border-bottom: none;
        }

        .metric-label {
            color: var(--text-sub);
            font-size: 0.9rem;
        }

        .metric-value {
            font-weight: 700;
            font-size: 1rem;
        }

        .chart-container {
            position: relative;
            height: 250px;
            width: 100%;
            margin-top: 10px;
        }

        .btn-reset {
            background-color: var(--border-color);
            color: var(--text-main);
            border: none;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.75rem;
            cursor: pointer;
        }

        .btn-reset:hover {
            background-color: var(--accent-color);
            color: #000;
        }
    </style>
</head>
<body>

    <h1>🚀 MSTR & BTC Real-time Dashboard</h1>

    <div class="grid">
        <!-- 메인 입력 카드 -->
        <div class="card">
            <div class="card-title">
                📌 기본 데이터 입력
                <button class="btn-reset" onclick="resetBtcPrice()">실시간 BTC 복귀</button>
            </div>
            <div class="input-group">
                <label for="mstrPrice">MSTR 주가 ($)</label>
                <input type="text" id="mstrPrice" value="130.00">
            </div>
            <div class="input-group">
                <label for="btcHoldings">BTC 보유량 (개)</label>
                <input type="text" id="btcHoldings" value="628,791">
            </div>
            <div class="input-group">
                <label for="btcPrice">비트코인 가격 ($)</label>
                <input type="text" id="btcPrice" value="88,000">
            </div>
            <div class="input-group">
                <label for="adso">ADSO - 기본 주식수 (M 주)</label>
                <input type="text" id="adso" value="278.0">
            </div>
            <div class="input-group">
                <label for="fdso">FDSO - 희석 주식수 (M 주)</label>
                <input type="text" id="fdso" value="340.0">
            </div>
        </div>

        <!-- 핵심 지표 출력 카드 -->
        <div class="card">
            <div class="card-title">📊 핵심 NAV 및 주당 보유량</div>
            <div class="metric-row">
                <span class="metric-label">mNAV (배수)</span>
                <span class="metric-value" id="resMnav" style="color: var(--accent-color); font-size: 1.2rem;">-</span>
            </div>
            <div class="metric-row">
                <span class="metric-label">Net BPS ($)</span>
                <span class="metric-value" id="resNetBps">-</span>
            </div>
            <div class="metric-row">
                <span class="metric-label">Gross Sats / Share (ADSO)</span>
                <span class="metric-value" id="resGrossSats">-</span>
            </div>
            <div class="metric-row">
                <span class="metric-label">Net Sats / Share (FDSO)</span>
                <span class="metric-value" id="resNetSats">-</span>
            </div>
        </div>

        <!-- 시뮬레이터 카드 -->
        <div class="card">
            <div class="card-title">🎯 목표가 시뮬레이터</div>
            <div class="input-group">
                <label for="targetBtcPrice">목표 BTC 가격 ($)</label>
                <input type="text" id="targetBtcPrice" value="150,000">
            </div>
            <div class="input-group">
                <label for="targetMnav">목표 mNAV 배수</label>
                <input type="text" id="targetMnav" value="2.0">
            </div>
            <div style="margin-top: 15px;">
                <div class="metric-row">
                    <span class="metric-label">예상 MSTR 주가 ($)</span>
                    <span class="metric-value" id="simMstrPrice" style="color: var(--green); font-size: 1.2rem;">-</span>
                </div>
                <div class="metric-row">
                    <span class="metric-label">예상 Net BPS ($)</span>
                    <span class="metric-value" id="simNetBps">-</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 차트 영역 -->
    <div class="grid">
        <div class="card">
            <div class="card-title">📈 바이낸스 선물 펀딩비 (Funding Rate)</div>
            <div class="chart-container">
                <canvas id="fundingChart"></canvas>
            </div>
        </div>
        <div class="card">
            <div class="card-title">📊 미결제약정 (Open Interest)</div>
            <div class="chart-container">
                <canvas id="oiChart"></canvas>
            </div>
        </div>
    </div>

    <script>
        let userEditedBtcPrice = false;
        let apiBtcPrice = 0;

        let chartFunding = null;
        let chartOI = null;

        // 천단위 콤마 파싱
        function parseNum(val) {
            if (!val) return 0;
            return parseFloat(String(val).replace(/,/g, '')) || 0;
        }

        // 숫자 포맷팅
        function fmt(num, decimals = 2) {
            return num.toLocaleString('en-US', { minimumFractionDigits: decimals, maximumFractionDigits: decimals });
        }

        // 메인 계산기
        function calculateMstr() {
            const mstrPrice = parseNum(document.getElementById('mstrPrice').value);
            const btcHoldings = parseNum(document.getElementById('btcHoldings').value);
            const btcPrice = parseNum(document.getElementById('btcPrice').value);
            const adso = parseNum(document.getElementById('adso').value) || 1;
            const fdso = parseNum(document.getElementById('fdso').value) || 1;

            // 분리 수식 연산
            const grossSats = Math.round((btcHoldings * 100) / adso);
            const netSats = Math.round((btcHoldings * 100) / fdso);

            const netBps = (btcHoldings * btcPrice) / (fdso * 1000000);
            const mnav = netBps > 0 ? (mstrPrice / netBps) : 0;

            document.getElementById('resMnav').innerText = fmt(mnav, 2) + 'x';
            document.getElementById('resNetBps').innerText = '$' + fmt(netBps, 2);
            document.getElementById('resGrossSats').innerText = fmt(grossSats, 0) + ' Sats';
            document.getElementById('resNetSats').innerText = fmt(netSats, 0) + ' Sats';

            calculateSimulator();
        }

        // 목표가 시뮬레이터
        function calculateSimulator() {
            const targetBtc = parseNum(document.getElementById('targetBtcPrice').value);
            const targetMnav = parseNum(document.getElementById('targetMnav').value);
            const btcHoldings = parseNum(document.getElementById('btcHoldings').value);
            const fdso = parseNum(document.getElementById('fdso').value) || 1;

            const simNetBps = (btcHoldings * targetBtc) / (fdso * 1000000);
            const simMstr = simNetBps * targetMnav;

            document.getElementById('simMstrPrice').innerText = '$' + fmt(simMstr, 2);
            document.getElementById('simNetBps').innerText = '$' + fmt(simNetBps, 2);
        }

        // 실시간 비트코인 가격 복귀
        function resetBtcPrice() {
            userEditedBtcPrice = false;
            if (apiBtcPrice > 0) {
                document.getElementById('btcPrice').value = fmt(apiBtcPrice, 2);
                calculateMstr();
            }
        }

        // 이벤트 리스너 바인딩
        const inputs = ['mstrPrice', 'btcHoldings', 'btcPrice', 'adso', 'fdso'];
        inputs.forEach(id => {
            document.getElementById(id).addEventListener('input', (e) => {
                if (id === 'btcPrice') {
                    userEditedBtcPrice = true;
                }
                calculateMstr();
            });
        });

        ['targetBtcPrice', 'targetMnav'].forEach(id => {
            document.getElementById(id).addEventListener('input', calculateSimulator);
        });

        // 바이낸스 API 가져오기
        async function fetchBinanceData() {
            const btcInput = document.getElementById('btcPrice');

            try {
                // 1. 실시간 BTC 가격
                const tickerRes = await fetch('https://fapi.binance.com/fapi/v1/ticker/price?symbol=BTCUSDT');
                const tickerData = await tickerRes.json();
                apiBtcPrice = parseFloat(tickerData.price);

                // 사용자가 편집 중이 아니면 자동 반영
                if (!userEditedBtcPrice && document.activeElement !== btcInput) {
                    btcInput.value = fmt(apiBtcPrice, 2);
                    calculateMstr();
                }

                // 2. 펀딩비 히스토리
                const fundRes = await fetch('https://fapi.binance.com/fapi/v1/fundingRate?symbol=BTCUSDT&limit=20');
                const fundData = await fundRes.json();
                renderFundingChart(fundData);

                // 3. 미결제약정 히스토리
                const oiRes = await fetch('https://fapi.binance.com/futures/data/openInterestHist?symbol=BTCUSDT&period=1h&limit=20');
                const oiData = await oiRes.json();
                renderOIChart(oiData);

            } catch (err) {
                console.error("API Fetch Error:", err);
            }
        }

        function renderFundingChart(data) {
            const ctx = document.getElementById('fundingChart').getContext('2d');
            const labels = data.map(d => new Date(d.fundingTime).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}));
            const rates = data.map(d => (parseFloat(d.fundingRate) * 100).toFixed(4));

            if (chartFunding) chartFunding.destroy();

            chartFunding = new Chart(ctx, {
                type: 'line',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Funding Rate (%)',
                        data: rates,
                        borderColor: '#38bdf8',
                        backgroundColor: 'rgba(56, 189, 248, 0.1)',
                        fill: true,
                        tension: 0.3
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { x: { ticks: { color: '#94a3b8' } }, y: { ticks: { color: '#94a3b8' } } }
                }
            });
        }

        function renderOIChart(data) {
            const ctx = document.getElementById('oiChart').getContext('2d');
            const labels = data.map(d => new Date(d.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'}));
            const oi = data.map(d => parseFloat(d.sumOpenInterestValue) / 1000000); // 백만 달러 단위

            if (chartOI) chartOI.destroy();

            chartOI = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Open Interest ($M)',
                        data: oi,
                        backgroundColor: '#22c55e'
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: { legend: { display: false } },
                    scales: { x: { ticks: { color: '#94a3b8' } }, y: { ticks: { color: '#94a3b8' } } }
                }
            });
        }

        // 초기 구동
        calculateMstr();
        fetchBinanceData();
        setInterval(fetchBinanceData, 30000); // 30초 주기 자동 갱신
    </script>
</body>
</html>
