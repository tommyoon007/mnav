<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSTR Dashboard</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="container">
        <!-- 1. 입력 카드 -->
        <div class="card">
            <div class="input-group">
                <label>BTC 보유량</label>
                <input type="number" id="btcHoldings" value="845050">
            </div>
            <div class="input-group">
                <label>ADSO (M)</label>
                <input type="number" id="adso" value="424.479" step="0.001">
            </div>
            <div class="input-group">
                <label>FDSO (M)</label>
                <input type="number" id="fdso" value="450.090" step="0.001">
            </div>
        </div>

        <!-- 2. 종합 분석 카드 -->
        <div class="card">
            <div class="card-title">🔥 다중 지표 레버리지 위험도 (종합 분석)</div>
            
            <div class="sub-cards">
                <div class="sub-card">
                    <div class="sub-title">FUNDING RATE (8H)</div>
                    <div class="sub-value orange" id="fundingRate">0.0057%</div>
                </div>
                <div class="sub-card">
                    <div class="sub-title">BTC OPEN INTEREST</div>
                    <div class="sub-value blue" id="openInterest">108.1K BTC</div>
                </div>
            </div>

            <div class="risk-center">
                <div class="risk-title">시장 종합 위험 스펙트럼 (5단계)</div>
                <div id="riskBadge" class="risk-badge low">🟢 2단계: 안정적 (저위험)</div>
                <div id="riskDesc" class="risk-desc">과도한 레버리지가 해소된 안정적인 시장 상태입니다.</div>
            </div>

            <div class="pills-row">
                <span class="pill">공포탐욕: <strong id="fearGreed">63</strong></span>
                <span class="pill highlight" id="mnavText">MSTR 프리미엄: 1.05x</span>
                <span class="pill">L/S 비율: <strong id="longShortRatio">1.34</strong></span>
            </div>
        </div>

        <!-- 3. 차트 카드 -->
        <div class="card">
            <div class="chart-header">
                <div class="chart-title">📊 프로 차트 (좌: 펀딩비 / 우1: OI / 우2: 롱숏비율)</div>
                <div class="timeframe-buttons">
                    <button class="btn-tf" data-tf="1D">1D</button>
                    <button class="btn-tf active" data-tf="1M">1M</button>
                    <button class="btn-tf" data-tf="3M">3M</button>
                    <button class="btn-tf" data-tf="6M">6M</button>
                    <button class="btn-tf" data-tf="1Y">1Y</button>
                    <button class="btn-tf" data-tf="MAX">MAX</button>
                </div>
            </div>
            <div class="chart-wrapper">
                <canvas id="chartCanvas"></canvas>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
