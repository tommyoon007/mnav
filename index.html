<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSTR mNAV Dashboard</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; padding: 16px; }
        .card { background-color: #1e1e1e; border-radius: 12px; padding: 16px; margin-bottom: 16px; border: 1px solid #2a2a2a; }
        .card-title { font-size: 14px; color: #ff9f0a; font-weight: bold; margin-bottom: 12px; }
        .status-box { font-size: 13px; color: #aaa; margin-bottom: 16px; line-height: 1.4; }
        .input-group { margin-bottom: 12px; }
        .input-group label { display: block; font-size: 13px; color: #aaa; margin-bottom: 4px; }
        .input-group input { width: 100%; padding: 12px; background-color: #0d1117; border: 1px solid #30363d; border-radius: 8px; color: #fff; font-size: 16px; font-weight: bold; box-sizing: border-box; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
        .result-card { background: #161b22; padding: 12px; border-radius: 8px; border: 1px solid #30363d; }
        .result-label { font-size: 11px; color: #8b949e; font-weight: bold; }
        .result-val { font-size: 18px; font-weight: bold; margin-top: 4px; }
        .result-sub { font-size: 11px; color: #8b949e; margin-top: 2px; }
        .signal-box { margin-top: 12px; padding: 12px; background: #161b22; border-radius: 8px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

    <div class="card">
        <h2 style="margin:0 0 8px 0;">₿ MSTR mNAV</h2>
        <p style="margin:0; font-size:13px; color:#aaa;">Strategy 공식 Net Reserve 기반</p>
    </div>

    <div class="card">
        <div class="card-title">⚡ 자동 데이터</div>
        <div class="status-box">
            <div><strong>자동 업데이트</strong></div>
            <div id="dataStatus">연동 중...</div>
        </div>

        <div class="input-group">
            <label for="btcPrice">BTC 가격 ($)</label>
            <input type="text" id="btcPrice" value="77958.01">
        </div>

        <div class="input-group">
            <label for="mstrPrice">MSTR 주가 ($) <span style="color:#ff9f0a; font-size:11px;">(장외 프리/애프터 포함)</span></label>
            <input type="text" id="mstrPrice" value="132.94">
        </div>

        <div class="input-group">
            <label for="btcHoldings">BTC 보유량</label>
            <input type="text" id="btcHoldings" value="845050">
        </div>

        <div class="input-group">
            <label for="adso">ADSO (M)</label>
            <input type="text" id="adso" value="298.039">
        </div>

        <div class="input-group">
            <label for="fdso">FDSO (M)</label>
            <input type="text" id="fdso" value="424.479">
        </div>
    </div>

    <div class="card">
        <div class="card-title">📊 핵심 결과</div>
        <div class="grid">
            <div class="result-card">
                <div class="result-label">GROSS BTC / SHARE</div>
                <div class="result-val" id="grossBpsSats">-</div>
                <div class="result-sub">Sats</div>
            </div>
            <div class="result-card">
                <div class="result-label">NET BTC / SHARE</div>
                <div class="result-val" id="netBpsSats">-</div>
                <div class="result-sub">Sats</div>
            </div>
            <div class="result-card">
                <div class="result-label">NET BPS (USD)</div>
                <div class="result-val" id="netBpsUsd">-</div>
            </div>
            <div class="result-card">
                <div class="result-label">현재 MNAV</div>
                <div class="result-val" id="mnavMultiple">-</div>
                <div class="result-sub" id="premium">프리미엄: -</div>
            </div>
        </div>
        <div class="signal-box" id="signal">계산 중...</div>
    </div>

    <script src="script.js?v=20260901"></script>
</body>
</html>
